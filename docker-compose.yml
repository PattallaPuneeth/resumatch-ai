services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resumatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resumatch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resumatch_password}
      POSTGRES_DB: ${POSTGRES_DB:-resumatch}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resumatch_user} -d ${POSTGRES_DB:-resumatch}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resumatch-network

  redis:
    image: redis:7-alpine
    container_name: resumatch-redis
    restart: unless-stopped
    command: redis-server --maxmemory-policy noeviction --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resumatch-network

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: resumatch-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resumatch-network

  minio-setup:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: resumatch-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin}; do
        echo 'Waiting for MinIO...';
        sleep 1;
      done;
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_NAME:-resumes};
      /usr/bin/mc anonymous set none myminio/${MINIO_BUCKET_NAME:-resumes};
      echo 'MinIO private bucket initialization complete.';
      exit 0;
      "
    networks:
      - resumatch-network

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumatch-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-resumatch_user}:${POSTGRES_PASSWORD:-resumatch_password}@postgres:5432/${POSTGRES_DB:-resumatch}?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    networks:
      - resumatch-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumatch-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      # Tracing is off unless OTEL_EXPORTER_OTLP_ENDPOINT is set (e.g. http://otel-lgtm:4318 with
      # `--profile observability`), so load-test numbers stay free of tracing overhead.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-resumatch_user}:${POSTGRES_PASSWORD:-resumatch_password}@postgres:5432/${POSTGRES_DB:-resumatch}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${MINIO_BUCKET_NAME:-resumes}
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      S3_FORCE_PATH_STYLE: "true"
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-resumes}
      ML_SERVICE_URL: http://ml:8000
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      RESUME_CAP_PER_USER: ${RESUME_CAP_PER_USER:-50}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      USAGE_DEFAULT_PLAN: ${USAGE_DEFAULT_PLAN:-unlimited}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      JOB_SOURCE_ALLOWLIST: ${JOB_SOURCE_ALLOWLIST:-boards.greenhouse.io,jobs.lever.co,jobs.ashbyhq.com}
    ports:
      - "127.0.0.1:4000:4000"
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - resumatch-network

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: resumatch-ml
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8000
      HOST: 0.0.0.0
      EMBEDDING_DIMENSION: 384
      # Tracing is off unless OTEL_EXPORTER_OTLP_ENDPOINT is set (e.g. http://otel-lgtm:4318 with
      # `--profile observability`), so load-test numbers stay free of tracing overhead.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      DATABASE_URL: postgresql://${POSTGRES_USER:-resumatch_user}:${POSTGRES_PASSWORD:-resumatch_password}@postgres:5432/${POSTGRES_DB:-resumatch}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${MINIO_BUCKET_NAME:-resumes}
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GROQ_MODEL_PRIMARY: ${GROQ_MODEL_PRIMARY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      GROQ_MODEL_EMERGENCY: ${GROQ_MODEL_EMERGENCY:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    ports:
      - "127.0.0.1:8000:8000"
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000
      - /home/appuser/.cache:uid=1000,gid=1000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - resumatch-network

  ml-worker:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: resumatch-ml-worker
    restart: unless-stopped
    command: ["python", "-m", "ml.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-resumatch_user}:${POSTGRES_PASSWORD:-resumatch_password}@postgres:5432/${POSTGRES_DB:-resumatch}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # Tracing is off unless OTEL_EXPORTER_OTLP_ENDPOINT is set (e.g. http://otel-lgtm:4318 with
      # `--profile observability`), so load-test numbers stay free of tracing overhead.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      # Set OCR_QUEUE_ENABLED=true together with `--profile ocr-worker` to move scanned-PDF OCR
      # to ml-ocr-worker. Off by default: this worker then runs OCR inline as before.
      OCR_QUEUE_ENABLED: ${OCR_QUEUE_ENABLED:-false}
      S3_REGION: us-east-1
      S3_BUCKET: ${MINIO_BUCKET_NAME:-resumes}
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GROQ_MODEL_PRIMARY: ${GROQ_MODEL_PRIMARY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      GROQ_MODEL_EMERGENCY: ${GROQ_MODEL_EMERGENCY:-}
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000
      - /home/appuser/.cache:uid=1000,gid=1000
    deploy:
      resources:
        limits:
          memory: 2g
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys; sys.exit(0)'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - resumatch-network

  # Optional OCR-only worker (Phase 10B sprint 2A). Serves resume-ocr-queue, one scan at a time,
  # and loads no transformer models. Start with:
  #   OCR_QUEUE_ENABLED=true docker compose --profile ocr-worker up -d
  ml-ocr-worker:
    extends:
      service: ml-worker
    container_name: resumatch-ml-ocr-worker
    profiles: ["ocr-worker"]
    environment:
      WORKER_QUEUES: ocr
      OCR_QUEUE_ENABLED: "true"
    deploy:
      resources:
        limits:
          memory: 1g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resumatch-frontend
    restart: unless-stopped
    depends_on:
      - backend
      - ml
    environment:
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "127.0.0.1:3000:3000"
    user: "1000:1000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000
      - /app/.next/cache:uid=1000,gid=1000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - resumatch-network

  # Phase 10B Workstream B: one container with OTel Collector, Tempo, Prometheus, Loki and
  # Grafana. Only starts with `docker compose --profile observability up`.
  otel-lgtm:
    image: grafana/otel-lgtm:0.36.0
    container_name: resumatch-otel-lgtm
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3001:3000"   # Grafana (admin/admin on first login, local only)
      - "127.0.0.1:4318:4318"   # OTLP/HTTP
    volumes:
      - ./observability/dashboards:/otel-lgtm/resumatch-dashboards:ro
      - ./observability/grafana-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/resumatch.yaml:ro
    networks:
      - resumatch-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  resumatch-network:
    driver: bridge
