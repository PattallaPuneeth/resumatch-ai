name: ResuMatch AI — Quality Gates & CI Pipeline

on:
  push:
    branches: [main, master, 'queue/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Fastify / TypeScript / Node 22)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: resumatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Validate Prisma Schema
        working-directory: backend
        run: npx prisma validate --schema=db/schema.prisma

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate --schema=db/schema.prisma

      - name: Push Test Database Schema
        working-directory: backend
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/resumatch_test
        run: npx prisma db push --schema=db/schema.prisma

      - name: Typecheck & Build
        working-directory: backend
        run: npm run build

      - name: Run Backend Vitest Suite
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/resumatch_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: supersecretjwtkeyforciqualitygate123456789012
          INTERNAL_API_TOKEN: supersecretinternalapitokenforciqualitygate1234
        run: npm test

  frontend-ci:
    name: Frontend CI (Next.js 15 / React / TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run Vitest Suite
        working-directory: frontend
        run: npm test

      - name: Production Build
        working-directory: frontend
        run: npm run build

  ml-ci:
    name: ML Service CI (Python 3.11 / FastAPI / PyTorch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a6ea86ab843b41 # v5.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Run Ruff Lint
        run: python -m ruff check ml

      - name: Run Mypy Typecheck
        run: python -m mypy --config-file ml/pyproject.toml ml

      - name: Run Pytest Suite
        run: python -m pytest ml/tests

  ml-eval-gate:
    name: ML Eval Quality Gate (Ranking Accuracy & Calibration)
    runs-on: ubuntu-latest
    needs: [ml-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a6ea86ab843b41 # v5.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Execute CI Eval Gate
        run: python -m ml.eval.gate --fixture-dir ml/eval/ci_fixtures --baseline ml/eval/ci_fixtures/baseline.json

  security-ci:
    name: Security Quality Gate (Gitleaks & Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@e364ebc49dd309bf6dbd5b8813cc8d1a12365dfb # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
