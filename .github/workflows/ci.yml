name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-ci:
    name: Backend (Node / Fastify / TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Typecheck & Build
        working-directory: backend
        run: npm run build

      - name: Run Vitest Suite
        working-directory: backend
        run: npm test

  ml-ci:
    name: ML Service (Python 3.11 / FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Run Ruff Lint
        run: python -m ruff check ml

      - name: Run Mypy Typecheck
        run: python -m mypy --config-file ml/pyproject.toml ml

      - name: Run Pytest Suite
        run: python -m pytest ml/tests

  frontend-ci:
    name: Frontend (Next.js / TypeScript / React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run Vitest Suite
        working-directory: frontend
        run: npm test

      - name: Build Next.js Application
        working-directory: frontend
        run: npm run build
