name: ResuMatch AI — Quality Gates & CI Pipeline

on:
  push:
    branches: [main, master, 'queue/**']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code & Container Linting (Actionlint / Hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Actionlint Workflow Linter
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo rhysd/actionlint:1.7.7

      - name: Run Hadolint Dockerfile Linter
        run: docker run --rm -v "${{ github.workspace }}:/repo" -w /repo hadolint/hadolint:v2.12.0 hadolint -c /repo/.hadolint.yaml backend/Dockerfile frontend/Dockerfile ml/Dockerfile

  backend-ci:
    name: Backend CI (Fastify / TypeScript / Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: resumatch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Validate Prisma Schema
        working-directory: backend
        env:
          # schema.prisma reads env("DATABASE_URL"); validate fails without it on a clean runner
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/resumatch_test
        run: npx prisma validate --schema=db/schema.prisma

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate --schema=db/schema.prisma

      - name: Deploy Prisma Migrations on Empty Database
        working-directory: backend
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/resumatch_test
        run: npx prisma migrate deploy --schema=db/schema.prisma

      - name: Check Migration Status & Drift
        working-directory: backend
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/resumatch_test
        run: npx prisma migrate status --schema=db/schema.prisma

      - name: Typecheck & Build
        working-directory: backend
        run: npm run build

      - name: Run Backend Vitest Suite
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/resumatch_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          # backend/vitest.config.ts falls back to REDIS_URL=redis://127.0.0.1:56379 (the local
          # CI stack); redis.ts prefers REDIS_URL, so without this the runner's Redis service is
          # never reached and ioredis retries until the 10-minute job timeout.
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: supersecretjwtkeyforciqualitygate123456789012
          INTERNAL_API_TOKEN: supersecretinternalapitokenforciqualitygate1234
        run: npm test

  frontend-ci:
    name: Frontend CI (Next.js 15 / React / TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint Check
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Run Vitest Suite
        working-directory: frontend
        run: npm test

      - name: Production Build
        working-directory: frontend
        run: npm run build

  ml-ci:
    name: ML Service CI (Python 3.11 / FastAPI / PyTorch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt
          pip install pip-audit

      - name: Run Pip Audit Security Scan
        run: python -m pip_audit -r ml/requirements.txt || true

      - name: Run Ruff Lint
        run: python -m ruff check ml

      - name: Run Mypy Typecheck
        run: python -m mypy --config-file ml/pyproject.toml ml

      - name: Run Pytest Suite
        # Tests marked `integration` need the migrated Postgres schema and MinIO; the e2e job
        # runs them inside the compose stack.
        env:
          # CI-only placeholder; without it the internal-token auth tests get 401 (no .env on runners)
          INTERNAL_API_TOKEN: supersecretinternalapitokenforciqualitygate1234
        run: python -m pytest ml/tests -m "not live and not integration"

  ml-eval-gate:
    name: ML Eval Quality Gate (Ranking Accuracy & Calibration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ml-ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt

      - name: Execute CI Eval Gate
        run: python -m ml.eval.gate --fixture-dir ml/eval/ci_fixtures --baseline ml/eval/ci_fixtures/baseline.json

  security-ci:
    name: Security Quality Gate (Gitleaks & Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Detection
        uses: gitleaks/gitleaks-action@f586c14365d4643c6aa59d472ae6e984bf47bb34 # v2.3.8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Trivy Vulnerability Scanner (Filesystem)
        # v0.29.0 depended on aquasecurity/setup-trivy@v0.2.2, a tag that no longer exists
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '0'

  e2e:
    name: End-to-End API Smoke Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CI-only placeholder secrets (same pattern as k6-smoke). backend and ml refuse to start
      # without them, so the stack never became healthy and `up --wait` failed.
      JWT_SECRET: supersecretjwtkeyforciqualitygate123456789012
      INTERNAL_API_TOKEN: supersecretinternalapitokenforciqualitygate1234
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22

      - name: Start Docker Stack in Isolated Mock Mode
        run: |
          docker compose -f docker-compose.yml -f docker-compose.llm-off.yml up -d --wait

      - name: Run End-to-End API Smoke Suite
        run: node e2e/smoke.mjs

      - name: Run ML Integration Tests Inside the Stack (Postgres + MinIO)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.llm-off.yml exec -T ml             sh -c 'cd /workspace/ml && python -m pytest -p no:cacheprovider -m integration'

      - name: Teardown Docker Stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.llm-off.yml down

  k6-smoke:
    name: k6 Load-Test Smoke (mock LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI-only placeholder secrets (same pattern as backend-ci); never used outside CI.
      JWT_SECRET: supersecretjwtkeyforciqualitygate123456789012
      INTERNAL_API_TOKEN: supersecretinternalapitokenforciqualitygate1234
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Start Docker Stack in Load-Test Mode (mock LLM, no provider keys)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.loadtest.yml up -d --build --wait

      - name: Wait for ml-worker to preload models and start consuming
        run: |
          timeout 300 bash -c 'until docker compose logs ml-worker 2>&1 | grep -q "Starting BullMQ"; do sleep 5; done'

      - name: Run k6 smoke scenario
        run: |
          # the k6 image runs as a non-root user; let it write its summary into the checkout
          chmod a+w loadtest/results
          loadtest/run.sh smoke ci

      - name: Fail if any real provider was called
        run: |
          if [ -s "$(ls loadtest/results/*_smoke_ci.provider_ledger.txt)" ]; then
            echo "Real provider request detected during load test"; exit 1
          fi

      - name: Upload k6 results
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: k6-smoke-results
          path: loadtest/results/*_smoke_ci*

      - name: Teardown Docker Stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.loadtest.yml down
