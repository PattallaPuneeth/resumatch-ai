[project]
name = "resumatch-ml"
version = "0.1.0"
description = "ResuMatch AI ML Microservice"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
plugins = ["pydantic.mypy"]
disable_error_code = ["import-untyped"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "psycopg",
    "psycopg.*",
    "pgvector",
    "pgvector.*",
    "pgvector.psycopg",
    "pgvector.psycopg.*",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "fitz",
    "fitz.*",
    "docx",
    "docx.*",
    "pytesseract",
    "pytesseract.*",
    "bullmq",
    "bullmq.*",
    "torch",
    "torch.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "transformers",
    "transformers.*",
]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["ml.tests.*", "tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
markers = [
    "live: live end-to-end integration tests requiring running docker cluster",
]
addopts = "-m 'not live'"

